<svg viewBox="0 0 400 320" width="400" height="320" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo Blanco YouTube Premium -->
  <defs>
    <linearGradient id="bg_yt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="gold_ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
  </defs>

  <rect width="400" height="320" rx="20" fill="url(#bg_yt)"/>

  <!-- Ranura de colgar -->
  <rect x="170" y="16" width="60" height="12" rx="6" fill="#000000" fill-opacity="0.15" stroke="#000000" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Perfiles (👤 1) en Negro -->
  <g transform="translate(20, 14)">
    <path d="M8 8c1.8 0 3.2-1.4 3.2-3.2S9.8 1.6 8 1.6 4.8 3 4.8 4.8 6.2 8 8 8zm0 1.6c-2.1 0-6.4 1.1-6.4 3.2v1.6h12.8v-1.6c0-2.1-4.3-3.2-6.4-3.2z" fill="#111111"/>
    <text x="18" y="14" fill="#111111" font-family="'Outfit', sans-serif" font-size="18" font-weight="800">1</text>
  </g>

  <!-- Medalla dorada -->
  <g transform="translate(344, 12)">
    <circle cx="16" cy="14" r="11" fill="url(#gold_grad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <polygon points="16,7 18.2,11.6 23.2,12.3 19.6,15.8 20.4,20.8 16,18.4 11.6,20.8 12.4,15.8 8.8,12.3 13.8,11.6" fill="#FFFFFF"/>
    <path d="M11 23 L9 32 L16 28 L23 32 L21 23" fill="url(#gold_ribbon)"/>
  </g>

  <!-- Watermark "You STREAMING" -->
  <text x="24" y="300" fill="#666666" fill-opacity="0.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="1">
    <tspan font-family="'Caveat', cursive" font-size="16">You</tspan> STREAMING
  </text>

  <!-- Logo YouTube Premium Centrado -->
  <g transform="translate(55, 125)">
    <rect x="10" y="6" width="76" height="52" rx="14" fill="#FF0000"/>
    <polygon points="42,22 62,32 42,42" fill="#FFFFFF"/>
    <text x="96" y="46" fill="#111111" font-family="'Outfit', sans-serif" font-size="38" font-weight="800" letter-spacing="-1">Premium</text>
  </g>
</svg>
